[package]
name = "luna"
version = "0.2.0"
edition = "2024"
description = "Luna CLI for codex-app-server-sdk"
license = "MIT"
repository = "https://github.com/thehumanworks/codex-sdk-rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
codex-app-server-sdk = { path = "../sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util"] }
toml = "0.8"
