[package]
name = "spark"
version = "0.1.0"
edition = "2024"
description = "Spark CLI for codex-app-server-sdk"
license = "MIT"
repository = "https://github.com/example/codex-app-server-sdk"

[features]
default = ["ws"]
ws = ["codex-app-server-sdk/ws"]

[dependencies]
codex-app-server-sdk = { path = "../sdk", default-features = false, features = ["stdio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }
