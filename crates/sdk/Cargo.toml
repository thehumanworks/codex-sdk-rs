[package]
name = "codex-app-server-sdk"
version = "0.4.0"
edition = "2024"
description = "Tokio Rust SDK for Codex App Server"
license = "MIT"
repository = "https://github.com/thehumanworks/codex-sdk-rs"
documentation = "https://docs.rs/codex-app-server-sdk"
homepage = "https://github.com/thehumanworks/codex-sdk-rs"
readme = "README.md"
keywords = ["codex", "openai", "json-rpc", "sdk"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
codex-app-server-sdk-macros = { path = "../../codex-app-server-sdk-macros", version = "0.1.1" }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
url = "2"
tokio-tungstenite = "0.28"
futures-util = "0.3"
serde_yaml = "0.9"

[dev-dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
